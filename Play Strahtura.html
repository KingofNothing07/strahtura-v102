<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play Strahtura v1.02</title>
<link rel="icon" href="art/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="art/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d1f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strahtura">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2d1f10;--parch:#f3e6c6;--parch2:#ead9b0;--gold:#b8892b;--red:#8a2020;--light:#ecd9ab;--dark:#9a6a3a;--sq:min(10.5vw,64px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#2a1d12 radial-gradient(circle at 50% 0,#4a3220,#1c130b);color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:16px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
header{position:relative;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px 12px;padding:10px 16px;color:#f3e6c6;border-bottom:2px solid var(--gold)}
.hdr-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.hdr-side.right{justify-content:flex-end}
.hdr-mid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
input[type=range]{width:100%;accent-color:var(--gold)}
@media(max-width:860px){header{grid-template-columns:1fr}.hdr-side.right{justify-content:flex-start}}
#bMusic.off,#mMusic.off{opacity:.85}
#mZip{font-family:"EB Garamond",Georgia,serif;font-size:15px;background:var(--parch);color:var(--ink);border:1.5px solid var(--gold);border-radius:6px;padding:5px 10px;text-decoration:none}
body.sheet header{display:none}
body.sheet .modal{top:0;bottom:0;height:auto;background:transparent;align-items:center;padding:16px;z-index:80}
body.sheet .modal .box{max-height:92vh}
.menutop{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 8px}
.menutitle{display:flex;align-items:center;justify-content:center;gap:16px}
.crestwrap{display:flex;flex-direction:column;align-items:center;gap:1px;font-style:normal;font-family:Cinzel,Georgia,serif;font-size:11px;letter-spacing:.06em;color:#7a1a1a;font-weight:700}
.crestwrap img{width:84px;height:104px;object-fit:contain;display:block}
.lorekings{display:flex;justify-content:center;align-items:center;gap:22px;margin:8px 0 2px}
.loreking{width:148px;height:148px;background:#f6ead0;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 5px #efe0c0;overflow:hidden}
.loreking img{width:100%;height:100%;object-fit:cover}
header h1{font-size:22px;letter-spacing:.06em}
header .ver{font-size:13px;opacity:.75}
header .sp{flex:1}
button{font-family:"EB Garamond",Georgia,serif;font-size:15px;background:var(--parch);color:var(--ink);border:1.5px solid var(--gold);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover:not(:disabled){background:#fff4d6}
button.primary:hover:not(:disabled){background:#c99a35;color:#fff8e6}
button.danger:hover:not(:disabled){color:var(--red)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--gold);color:#fff8e6;border-color:#7a5a1a}
button.danger{border-color:var(--red);color:var(--red)}
.wrap{display:grid;grid-template-columns:230px auto 330px;gap:14px;padding:14px;align-items:start;justify-content:center}
@media(max-width:1100px){.wrap{grid-template-columns:1fr;justify-items:center}.panel{width:min(560px,96vw)}.center{order:-1}}
.panel{background:var(--parch);border:2px solid var(--gold);border-radius:10px;padding:10px 12px;box-shadow:0 4px 18px #0006}
.panel h2{font-size:15px;border-bottom:1px solid var(--gold);padding-bottom:4px;margin-bottom:6px}
.panel h3{font-size:13px;margin:8px 0 4px}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.status{width:calc(var(--sq)*8 + 44px);background:var(--parch);border:2px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:16px}
.status .who{font-family:Cinzel;font-weight:700}
.status .flags span{display:inline-block;margin:4px 6px 0 0;padding:1px 8px;border-radius:10px;background:var(--parch2);font-size:14px}
.status .flags .bad{background:var(--red);color:#fff}
#actbar:empty{display:none}
#actbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--parch);border-top:3px solid var(--gold);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 18px #0008}
#actbar .who{font-family:Cinzel,Georgia,serif;font-weight:700;text-align:center;margin-bottom:4px}
#actbar .btns{justify-content:center}
.arts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.arts2{grid-template-columns:1fr}}
.camp{display:grid;grid-template-columns:20px repeat(8,var(--sq)) 20px;align-items:center;color:#e9d6a8;font-size:12px;padding:4px 0}
.camp .lbl{grid-column:1/-1;text-align:center;font-family:Cinzel;font-size:12px;opacity:.85;margin:2px 0}
.camp .cs{margin:5px;height:calc(var(--sq) - 10px);border:2px dashed #c9a24f99;border-radius:8px;background:#2a1d1299;position:relative;display:flex;align-items:center;justify-content:center;cursor:default}
.camp .cs svg,.camp .cs img{width:80%;height:80%;object-fit:contain}
.camp .cs.full{border-color:#e7c766}
.camp .cs.blocked{border-color:#c0262b}
.camp .cs.fogok{cursor:pointer}
.camp .cs.ok{border-color:#2f7a2f;border-style:solid;background:#2f7a2f55;cursor:pointer}
.camp .cs .badge{position:absolute;right:2px;bottom:1px;font-size:11px;font-weight:700;background:#000a;color:#ffe9a8;border-radius:6px;padding:0 4px;font-family:Cinzel}
.boardwrap{display:grid;grid-template-columns:20px calc(var(--sq)*8) 20px;grid-template-rows:20px calc(var(--sq)*8) 20px;color:#e9d6a8;font-family:Cinzel;font-size:12px;background:#3b2918;border:3px solid var(--gold);border-radius:8px;padding:0}
.coords{display:flex;align-items:center;justify-content:space-around}
.coords.v{flex-direction:column}
.board{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border:2px solid #1c130b}
.sqr{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.sqr.l{background:var(--light)}.sqr.d{background:var(--dark)}
.sqr svg.pc,.sqr img.pc{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 2px 2px #0007);pointer-events:none}
.sqr svg.pc.big,.sqr img.pc.big{width:118%;height:118%}
.sqr .badge{position:absolute;right:2px;bottom:1px;font-size:11px;font-weight:700;background:#000a;color:#ffe9a8;border-radius:6px;padding:0 4px;font-family:Cinzel}
.sqr .tl{position:absolute;left:2px;top:0;font-size:13px}
.sqr.dim svg.pc,.sqr.dim img.pc{opacity:.55}
.plaque{width:100%;max-height:168px;object-fit:contain;display:block;margin:6px auto;border-radius:8px;background:#2a1c12}
.sqr.can::before{content:"";position:absolute;inset:2px;border:2px solid #ffffff55;border-radius:4px}
.sqr.selp::before{content:"";position:absolute;inset:0;border:4px solid #ffd76a;}
.sqr.h-mov::after,.sqr.h-pick::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#2f7a2fcc}
.sqr.h-pick::after{background:#c9a227dd}
.sqr.h-cap::after{content:"";position:absolute;inset:3px;border:4px solid #c0262bdd;border-radius:50%}
.sqr.h-stk::after{content:"";position:absolute;inset:3px;border:4px solid #2a5fbfdd;border-radius:8px}
.sqr.h-por::after{content:"";position:absolute;inset:3px;border:4px dashed #7b3cc0;border-radius:8px}
.sqr.h-ex::after{content:"";position:absolute;width:34%;height:34%;border-radius:50%;background:#7b3cc0cc}
.sqr.danger{box-shadow:inset 0 0 0 4px #e0302f, inset 0 0 18px #e0302f}
.sqr.place::after{content:"＋";position:absolute;color:#2f7a2f;font-size:28px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{flex:1 1 auto}
.card{border:1.5px solid var(--gold);border-radius:8px;padding:6px 8px;background:#fbf2dc;margin-bottom:6px}
.card .nm{font-family:Cinzel;font-weight:700;font-size:14px}
.card .fg{font-style:italic;font-size:13px;opacity:.8}
.card .cs{font-size:13px;color:var(--red)}
.card .tx{font-size:14px;margin-top:2px}
.card.used{opacity:.5}
.tw{display:flex;gap:6px;align-items:center;font-size:13px}
.tw .slot{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fbf2dc}
.tw .slot.lost{background:#d9c7a0;color:var(--red);font-weight:700}
.tw .slot svg,.tw .slot img{width:28px;height:28px;object-fit:contain}
.gy{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:14px}
.gy svg,.gy img{width:26px;height:26px;object-fit:contain}
.log{max-height:240px;overflow:auto;font-size:14px;background:#fbf2dc;border:1px solid var(--gold);border-radius:6px;padding:4px 6px}
.log div{border-bottom:1px dotted #c9b48a;padding:2px 0}
.hint{font-size:14px;font-style:italic;margin:4px 0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:80;padding:12px}
.modal .box{background:var(--parch);border:3px solid var(--gold);border-radius:12px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:16px 20px}
.modal h2{font-size:20px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pick{cursor:pointer}.pick:hover{background:#fff4d6}
.pick.taken{opacity:.35;cursor:default}
.rules h3{font-size:15px;margin-top:12px}
.rules li{margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:middle}
.clocks{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.clk{padding:1px 10px;border-radius:10px;background:var(--parch2);font-size:15px}
.clk.on{background:#2d1f10;color:#ffe9a8}.clk.low b{color:#e0302f}
textarea{width:100%;height:240px;font-family:monospace;font-size:12px}
/* Δ-17 board themes, highlights, effects */
.board.th-walnut .sqr.l{background:#e9cfa1 repeating-linear-gradient(97deg,rgba(120,80,40,.08) 0 2px,transparent 2px 9px)}
.board.th-walnut .sqr.d{background:#6f4528 repeating-linear-gradient(97deg,rgba(0,0,0,.14) 0 2px,transparent 2px 8px)}
.board.th-marble .sqr{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), inset 0 0 18px rgba(40,36,32,.18)}
.board.th-marble .sqr.l{background-color:#f4f0e8;background-image:radial-gradient(ellipse 90% 46% at 18% 28%,rgba(255,255,255,.55),transparent 62%),radial-gradient(ellipse 70% 40% at 82% 78%,rgba(176,170,160,.45),transparent 64%),linear-gradient(122deg,transparent 0 16%,rgba(148,144,154,.34) 17.4%,transparent 19.2%),linear-gradient(78deg,transparent 0 48%,rgba(120,116,126,.22) 49.2%,transparent 51%),linear-gradient(164deg,#fbf8f2,#e6e0d4 46%,#f3eee6 78%,#d9d2c6)}
.board.th-marble .sqr.l:nth-child(4n+1){background-image:radial-gradient(ellipse 80% 50% at 78% 22%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse 55% 36% at 12% 80%,rgba(160,154,146,.4),transparent 66%),linear-gradient(48deg,transparent 0 28%,rgba(130,126,138,.3) 29.3%,transparent 31%),linear-gradient(156deg,transparent 0 63%,rgba(110,106,116,.18) 64%,transparent 66%),linear-gradient(18deg,#f7f3ec,#e0d9cc 55%,#efeae2)}
.board.th-marble .sqr.d{background-color:#5a564f;background-image:radial-gradient(ellipse 75% 42% at 24% 18%,rgba(255,250,242,.2),transparent 58%),radial-gradient(ellipse 60% 48% at 80% 76%,rgba(18,14,12,.4),transparent 62%),linear-gradient(118deg,transparent 0 24%,rgba(255,255,255,.28) 25.2%,transparent 27%),linear-gradient(66deg,transparent 0 57%,rgba(255,244,230,.16) 58.1%,transparent 60%),linear-gradient(168deg,#6d6862,#3a3734 50%,#524e49)}
.board.th-marble .sqr.d:nth-child(4n+3){background-image:radial-gradient(ellipse 65% 38% at 70% 24%,rgba(255,255,255,.16),transparent 60%),radial-gradient(ellipse 50% 44% at 16% 72%,rgba(10,8,6,.38),transparent 64%),linear-gradient(32deg,transparent 0 36%,rgba(255,255,255,.22) 37.1%,transparent 39%),linear-gradient(142deg,transparent 0 60%,rgba(255,236,214,.12) 61%,transparent 63%),linear-gradient(200deg,#625e58,#2f2c2a 48%,#4a4642)}
.board.th-map .sqr.l{background-color:#ece0bf;background-image:radial-gradient(circle at 30% 70%,rgba(140,100,40,.12),transparent 55%);box-shadow:inset 0 0 0 .5px rgba(90,60,20,.35)}
.board.th-map .sqr.d{background-color:#cbb383;background-image:radial-gradient(circle at 70% 30%,rgba(90,60,20,.16),transparent 60%);box-shadow:inset 0 0 0 .5px rgba(90,60,20,.4)}
.board.th-night .sqr.l{background:#4b5568}.board.th-night .sqr.d{background:#2b3343}
.boardwrap.th-night{background:#1b2130;border-color:#8aa0c8;color:#cfd9ee}
.boardwrap.th-marble{background:#1c1a18;border-color:#e4ddd2}
.boardwrap.th-map{background:#5a4326}
.board.th-grass .sqr.l{background:#d7e3a6 repeating-linear-gradient(97deg,rgba(80,90,30,.08) 0 2px,transparent 2px 9px)}
.board.th-grass .sqr.d{background:#6f8a3e repeating-linear-gradient(97deg,rgba(0,0,0,.12) 0 2px,transparent 2px 8px)}
.boardwrap.th-grass{background:#243018;border-color:#c6a15a}
.sqr.lm{box-shadow:inset 0 0 0 100px rgba(255,214,80,.24)}
.board.th-night .sqr.lm{box-shadow:inset 0 0 0 100px rgba(140,180,255,.22)}
.sqr.danger{animation:dangerpulse 1.1s ease-in-out infinite}
@keyframes dangerpulse{0%,100%{box-shadow:inset 0 0 0 4px #e0302f,inset 0 0 18px #e0302f}50%{box-shadow:inset 0 0 0 4px #ff8a7f,inset 0 0 34px #ff4a3f}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
.fxg{position:fixed;pointer-events:none;display:flex;align-items:center;justify-content:center}
.fxg svg.gh,.fxg img.gh{width:88%;height:88%;object-fit:contain}
select{font-family:inherit;font-size:15px;padding:4px 6px;border:1.5px solid var(--gold);border-radius:6px;background:#fbf2dc;color:#2d1f10}
select option{background:#fbf2dc;color:#2d1f10}
.modal .box{color:#2d1f10}
.stylegrid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:8px 0}
.stylegrid label{font-family:Cinzel;font-size:14px}
.stylepreview{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;background:#c9a77a;border-radius:8px;padding:6px;margin:6px 0}
.stylepreview svg,.stylepreview img{width:44px;height:44px;object-fit:contain}
.minib{display:grid!important;grid-template-columns:repeat(4,40px);grid-template-rows:repeat(4,40px);margin:6px auto;width:max-content;border:2px solid #1c130b}
.minib .sqr{cursor:default}
.crest{width:22px;height:22px;vertical-align:-4px;margin-right:4px;object-fit:contain}
@media (prefers-reduced-motion: reduce){.sqr.danger{animation:none}}

.rules{max-width:860px;border:6px double var(--gold);background:#f6ead0 radial-gradient(circle at 50% 0,#fbf3df,#efdfb8)}
.rbclose{position:sticky;top:-16px;display:flex;justify-content:flex-end;z-index:2;margin:-6px -8px 0 0}
.rb .rbt{text-align:center;font-size:26px;color:#7a1a1a;letter-spacing:.05em}
.rb .rbs{text-align:center;font-style:italic;margin:2px 0 10px}
.rbtoc{columns:2;border:1.5px solid var(--gold);border-radius:8px;padding:8px 12px;background:#fbf2dc;margin-bottom:8px}
.rbtoc a{display:block;cursor:pointer;color:#5a2a0a;font-family:Cinzel;font-size:13px;padding:2px 0}
.rbtoc a:hover{color:#8a2020;text-decoration:underline}
.rb h3{font-size:18px;color:#7a1a1a;margin:18px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:3px;scroll-margin-top:40px}
.rb h3 .orn{color:var(--gold)}
.rb h4{font-family:Cinzel;margin:0 0 4px;font-size:15px}
.rb p.dc::first-letter{float:left;font-family:Cinzel;font-size:3.1em;line-height:.85;color:#8a2020;padding:4px 6px 0 0;text-shadow:1px 1px 0 var(--gold)}
.rbp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:8px 0}
@media(max-width:600px){.rbp{grid-template-columns:1fr}.rbtoc{columns:1}}
.rbq{border-collapse:collapse;width:100%;font-size:15px}.rbq th,.rbq td{border:1px solid var(--gold);padding:4px 8px;text-align:left}.rbq th{font-family:Cinzel;background:#efdcae}
</style>
</head>
<body>
<header>
  <div class="hdr-side">
    <h1>⚜ Strahtura</h1><span class="ver">v1.02 · strah-TOO-rah</span>
  </div>
  <div class="hdr-mid">
    <button id="bUndo">↶ Undo</button>
    <button id="bForfeit" class="danger">Forfeit</button>
    <button id="bNew" class="danger">New game</button>
  </div>
  <div class="hdr-side right">
    <label style="font-size:15px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cAuto"> Auto end turn</label>
    <button id="bPause" style="display:none">⏸ Pause</button>
    <button id="bStep" style="display:none">⏭ Step</button>
    <button id="bMusic" type="button" title="Mute music. Click again to play it. Effects stay on.">🔊</button>
    <button id="bStyle">⚙ Settings</button>
  </div>
</header>
<div class="wrap">
  <div class="panel" id="left"></div>
  <div class="center">
    <div class="status" id="status"></div>
    <div class="camp" id="campB"></div>
    <div class="boardwrap" id="boardwrap"></div>
    <div class="camp" id="campW"></div>
    <div id="actions" class="underboard"></div>
    <div id="arts" class="underboard arts2"></div>
  </div>
  <div id="right" style="display:flex;flex-direction:column;gap:12px"></div>
</div>
<div id="modal"></div>
<div id="actbar"></div>
<div id="fx"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="cgW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#f1e3c3"/><stop offset="1" stop-color="#c4aa7c"/></linearGradient>
<linearGradient id="cgB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5e5650"/><stop offset=".45" stop-color="#2c2622"/><stop offset="1" stop-color="#121010"/></linearGradient>
</defs></svg>
<script>
"use strict";
/* ===================== DATA ===================== */
const FILES='abcdefgh', NAME={w:'White',b:'Black'};
let prefs={piece:'woodcut',board:'classic',sound:true,music:true,vol:100,track:'pursuit',playing:'menu',motion:!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)};
try{const sp=JSON.parse(localStorage.getItem('strahtura_prefs15')||'null');if(sp&&typeof sp==='object')prefs=Object.assign(prefs,sp);}catch(e){}
if(prefs.piece==='painted'||prefs.piece==='carved')prefs.piece=prefs.piece==='carved'?'classic':'woodcut';
if(prefs.piece!=='woodcut'&&prefs.piece!=='woodhelm'&&prefs.piece!=='classic')prefs.piece='woodcut';
if(prefs.track!=='menu'&&prefs.track!=='pursuit'&&prefs.track!=='embers')prefs.track='pursuit';
if(typeof prefs.vol!=='number'||prefs.vol<0||prefs.vol>100)prefs.vol=100;
const DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]], ORTH=[[1,0],[-1,0],[0,1],[0,-1]], ALL8=[...DIAG,...ORTH];
const LJ=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const ART=[
 {id:'archers',name:'Hidden Archers',fig:'Line of archers on a platform',cost:'1 action (knight) · 2 (cavalry)',text:'Kill an enemy knight or cavalry standing on your half of the board.'},
 {id:'golem',name:'Stone Golem',fig:'Stone golem',cost:'2 actions',text:'One single Wizard Tower moves 1 square in any direction: onto an open square, capturing an enemy piece, or destroying an enemy tower or Archmage\'s Tower. It stays a single tower. An Archmage, and an Archmage\'s Tower, cannot be a golem.'},
 {id:'decree',name:'Royal Decree',fig:'Scroll',cost:'2 actions',text:'Promote any one of your single knights to a noble.'},
 {id:'banner',name:'War Banner',fig:'Banner on a pole',cost:'1 action',text:'One knight moves and captures like a cavalry (diagonal, up to 3) this turn.'},
 {id:'sellswords',name:'Sellswords',fig:'Hooded knight',cost:'1 action per pair',text:'Each action recruits 2 of your fallen knights to your camp squares (2 for 1 action, 4 for 2).'},
 {id:'berserker',name:'Berserker',fig:'Crazed Viking',cost:'2 actions',text:'A single knight captures diagonally forward again and again; stop whenever you choose.'},

const ART_HOW={

const ARTK={archers:['archers'],golem:['golem'],decree:['decree'],banner:['banner'],sellswords:['sell'],berserker:['berserk'],keg:['keg'],blink:['blink'],flank:['flank'],shield:['shield']};
const artById=id=>ART.find(a=>a.id===id);

/* ===================== HELPERS ===================== */
const sq=(r,c)=>FILES[c]+(8-r);
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const opp=p=>p==='w'?'b':'w';
const fwd=p=>p==='w'?-1:1;
const backRow=p=>p==='w'?7:0;
const homeRows=p=>p==='w'?[7,6]:[0,1];
const eq=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
const clone=o=>{const l=o.log;o.log=[];const t=JSON.parse(JSON.stringify(o));o.log=l;return t;};
function pname(s){if(s.t==='knight')return s.n===2?'Cavalry':'Knight';if(s.t==='noble')return s.n===2?'King':'Noble';if(s.t==='wizard')return s.n===2?'Archmage':'Wizard';if(s.n===2)return "Archmage's Tower";return 'Tower';}
const isPortal=(s,p)=>s&&s.o===p&&(s.t==='tower'||(s.t==='wizard'&&s.n===2));
function stacks(S,p){const o=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const s=S.b[r][c];if(s&&s.o===p)o.push({r,c,s});}return o;}
const nobleStacks=(S,p)=>stacks(S,p).filter(x=>x.s.t==='noble');
const nobleUnits=(S,p)=>nobleStacks(S,p).reduce((a,x)=>a+x.s.n,0);
const tradeRoom=(S,p)=>(S.rules&&S.rules.tradeCap)?S.rules.tradeCap-nobleUnits(S,p):99; // Δ-15: trades into nobles may not leave you above 4 nobles (king = 2)
const campCount=(S,p)=>S.camp[p].reduce((a,n)=>a+n,0);
const pieceCount=(S,p)=>stacks(S,p).reduce((a,x)=>a+x.s.n,0)+campCount(S,p);
const graveKnights=(S,p)=>S.grave.w[p].knight+S.grave.b[p].knight;
function takeKnight(S,p){if(S.grave[opp(p)][p].knight>0)S.grave[opp(p)][p].knight--;else S.grave[p][p].knight--;}
const mkG=()=>({w:{knight:0,noble:0,wizard:0,tower:0},b:{knight:0,noble:0,wizard:0,tower:0}});
const openBack=(S,p)=>{const r=backRow(p),o=[];for(let c=0;c<8;c++)if(!S.b[r][c])o.push(c);return o;};
function findId(S,id){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const s=S.b[r][c];if(s&&s.id===id)return{r,c,s};}return null;}

/* ===================== STATE ===================== */
function newState(){
  const b=[...Array(8)].map(()=>Array(8).fill(null));let id=1;
  const put=(r,c,o,t)=>{b[r][c]={id:id++,o,t,n:1};};
  for(let c=0;c<8;c++){
    put(7,c,'w',(c===3||c===4)?'noble':'knight');put(6,c,'w','knight');
    put(0,c,'b',(c===3||c===4)?'noble':'knight');put(1,c,'b','knight');
  }
  return{b,nextId:id,turn:'w',actionsLeft:1,first:{w:true,b:true},used:{},frozen:{},
    camp:{w:[0,0,0,0,0,0,0,0],b:[0,0,0,0,0,0,0,0]},mode:{ai:{w:null,b:null},minutes:0},rules:{pairRecruit:false,tradeCap:4,turnLimit:0,artifacts:true,hints:true},landed:{},clock:null,campNote:{w:[0,0,0,0,0,0,0,0],b:[0,0,0,0,0,0,0,0]},grave:{w:mkG(),b:mkG()},reserve:{w:2,b:2},
    art:{w:null,b:null},artUsed:{w:false,b:false},flankTurn:false,flankCount:0,shield:{},berserk:null,marched:{},
    phase:'setup',picker:'b',winner:null,result:'',log:[],turnNo:1};
}

/* ===================== MOVE GEOMETRY ===================== */
function dest(S,mv,r,c,o){
  const t=S.b[r][c],p=mv.o;
  if(!t)return o.empty?'move':null;
  if(t.o===p){
    if(o.stk&&!S.first[p]&&mv.n===1&&t.n===1&&t.t===mv.t&&!S.frozen[t.id]&&!(S.landed&&(S.landed[t.id]||S.landed[mv.id])))return 'stack';
    if(isPortal(t,p)&&t.id!==mv.id)return 'portal';
    return null;
  }
  if(!o.cap||S.shield[t.id])return null;
  if(t.t==='tower')return (mv.t==='wizard'&&mv.n===2)?'destroy':null;
  return 'capture';
}
function pieceMoves(S,r,c,via){
  const s=S.b[r][c],p=s.o,f=fwd(p),out=[];
  const add=(rr,cc,o)=>{if(!inB(rr,cc))return false;const m=dest(S,s,rr,cc,o);if(m)out.push({to:[rr,cc],mode:m});return !S.b[rr][cc];};
  const slide=(dirs,max,o)=>{for(const[dr,dc]of dirs)for(let k=1;k<=max;k++){const rr=r+dr*k,cc=c+dc*k;if(!inB(rr,cc))break;if(!add(rr,cc,o))break;}};
  if(via==='flank'){for(const dc of[-1,1])add(r,c+dc,{empty:true,stk:true,cap:false});return out;}
  if(via==='banner'){slide(DIAG,3,{empty:true,cap:true,stk:false});return out;}
  if(s.t==='knight'&&s.n===1){
    add(r+f,c,{empty:true,stk:true,cap:false});
    if(homeRows(p).includes(r)&&inB(r+f,c)&&!S.b[r+f][c])add(r+2*f,c,{empty:true,stk:true,cap:false});
    for(const dc of[-1,1])add(r+f,c+dc,{empty:false,stk:true,cap:true});
    add(r-f,c,{empty:true,stk:true,cap:false});
  }else if(s.t==='knight')slide(DIAG,3,{empty:true,cap:true});
  else if(s.t==='noble'&&s.n===1)slide(ORTH,3,{empty:true,cap:true,stk:true});
  else if(s.t==='noble')slide(ALL8,1,{empty:true,cap:true});
  else if(s.t==='wizard')for(const[dr,dc]of LJ)add(r+dr,c+dc,{empty:true,cap:true,stk:true});
  return out;
}
function portalOptions(S,r,c,tr,tc){
  const sr=tr+Math.sign(r-tr),sc=tc+Math.sign(c-tc);
  if(!inB(sr,sc))return[];
  const free=(x,y)=>!S.b[x][y]||(x===r&&y===c);
  if(!free(sr,sc))return[];
  const out=[];
  for(const[a,b]of ALL8){const er=tr+a,ec=tc+b;if(!inB(er,ec)||(er===sr&&ec===sc))continue;if(free(er,ec))out.push({exit:[er,ec],shift:[sr,sc]});}
  return out;
}
function attacked(S,p){ // squares side p could capture with one action
  const set=new Set();
  for(const{r,c,s}of stacks(S,p)){
    if(s.t==='tower')continue;
    for(const m of pieceMoves(S,r,c,'normal'))if(m.mode==='capture'||m.mode==='destroy')set.add(m.to[0]*8+m.to[1]);
    if(s.t==='wizard'){const tr=r+fwd(p);if(inB(tr,c)){const t=S.b[tr][c];if(t&&t.o!==p&&!S.shield[t.id]&&(t.t!=='tower'||s.n===2))set.add(tr*8+c);}}
  }
  return set;
}
const checkApplies=(S,p)=>nobleStacks(S,p).length===1;
function inDanger(S,p){const ns=nobleStacks(S,p);if(ns.length!==1)return false;return attacked(S,opp(p)).has(ns[0].r*8+ns[0].c);}
function dbl(S,s){
  const p=s.o;
  if(s.t==='noble'&&s.n===2)return true;
  const st=stacks(S,p),nob=st.filter(x=>x.s.t==='noble');
  if(s.t==='knight'&&s.n===1&&st.length===2&&campCount(S,p)===0&&nob.length===1&&nob[0].s.n===1)return true;
  return false;
}
function canMove(S,s){if(S.frozen[s.id]||s.t==='tower')return false;const u=S.used[s.id];if(!u)return true;if(u.x)return false;return u.m===0||(u.m===1&&dbl(S,s));}
function fresh(S,s){const u=S.used[s.id];return !S.frozen[s.id]&&(!u||(!u.x&&u.m===0));}
function bCaps(S,r,c){const s=S.b[r][c],f=fwd(s.o),o=[];for(const dc of[-1,1]){const tr=r+f,tc=c+dc;if(!inB(tr,tc))continue;const t=S.b[tr][tc];if(t&&t.o!==s.o&&t.t!=='tower'&&!S.shield[t.id])o.push([tr,tc]);}return o;}

/* ===================== ACTION GENERATION ===================== */
function expandMoves(S,A,r,c,list,k){
  for(const m of list){
    if(m.mode==='portal'){for(const pa of portalOptions(S,r,c,m.to[0],m.to[1]))A.push({k,from:[r,c],tower:m.to,exit:pa.exit,shift:pa.shift,mode:'portal',cost:1});}
    else A.push({k,from:[r,c],to:m.to,mode:m.mode,cost:1});
  }
}
function gen(S){
  const p=S.turn,A=[];
  if(S.phase!=='play'||S.winner)return A;
  if(S.berserk){const f=findId(S,S.berserk.id);if(f&&f.s.t==='knight')for(const to of bCaps(S,f.r,f.c))A.push({k:'bstep',from:[f.r,f.c],to,cost:0});A.push({k:'bstop',cost:0});return A;}
  if(S.actionsLeft<=0)return A;
  const L=S.actionsLeft;
  for(const{r,c,s}of stacks(S,p)){
    if(canMove(S,s))expandMoves(S,A,r,c,pieceMoves(S,r,c,'normal'),'move');
    if(fresh(S,s)){
      if(s.t==='wizard'){const tr=r+fwd(p);if(inB(tr,c)){const t=S.b[tr][c];if(t&&t.o!==p&&!S.shield[t.id]&&(t.t!=='tower'||s.n===2))A.push({k:'ranged',from:[r,c],to:[tr,c],cost:1});}}
      if(s.t==='knight'&&s.n===1){const f=fwd(p),mr=r+f,lr=r+2*f;if(inB(mr,c)&&inB(lr,c)){const mid=S.b[mr][c],land=S.b[lr][c];if(mid&&mid.o===p&&mid.t==='knight'&&mid.n===1&&!land){const cost=(homeRows(p).includes(r)&&!(S.marched&&S.marched[s.id]))?1:2;if(L>=cost)A.push({k:'front',from:[r,c],to:[lr,c],mode:'move',cost});}}}
      if(s.t==='tower'&&s.n===2)for(const[a,b]of ALL8){const tr=r+a,tc=c+b;if(!inB(tr,tc))continue;const t=S.b[tr][tc];if(t&&t.o===p)A.push({k:'relay',from:[r,c],to:[tr,tc],cost:1});}
      if(s.n===2)for(const[a,b]of ALL8){const er=r+a,ec=c+b;if(inB(er,ec)&&!S.b[er][ec])A.push({k:'unstack',from:[r,c],to:[er,ec],cost:1});}
      if(s.t==='knight'&&s.n===2&&(p==='w'?r<=3:r>=4)){const tc=S.rules&&S.rules.trade2?2:1;if(L>=tc&&tradeRoom(S,p)>=1)A.push({k:'cavnoble',at:[r,c],cost:tc});}
      if(s.t==='noble'&&s.n===1&&S.reserve[p]>0&&nobleUnits(S,p)>1)A.push({k:'totower',at:[r,c],cost:1});
      if((s.t==='wizard'||(s.t==='tower'&&s.n===1))&&tradeRoom(S,p)>=((s.t==='wizard'&&s.n===2)?2:1))A.push({k:'tonoble',at:[r,c],cost:1});
      if(s.t==='tower'||s.t==='wizard')A.push({k:'flip',at:[r,c],cost:1});
    }
  }
  if(graveKnights(S,p)>0&&!S.recruitedTurn)for(let c=0;c<8;c++)if((S.rules&&S.rules.pairRecruit?S.camp[p][c]<2:S.camp[p][c]===0)&&!S.b[backRow(p)][c])A.push({k:'recruit',file:c,cost:1}); // proposed rule: one recruit per camp square (no cavalry pairs) except via Sellswords
  const art=S.art[p];
  if(art&&!S.first[p]&&(!S.artUsed[p]||(art==='flank'&&S.flankTurn&&S.flankCount<2)))genArt(S,A,art,p,L);
  return A;
}
function genArt(S,A,art,p,L){
  const o=opp(p),half=p==='w'?[4,5,6,7]:[0,1,2,3],mine=stacks(S,p),theirs=stacks(S,o);
  if(art==='archers')for(const{r,c,s}of theirs)if(s.t==='knight'&&half.includes(r)&&!S.shield[s.id]&&L>=s.n)A.push({k:'archers',to:[r,c],cost:s.n});
  if(art==='golem'&&L>=2)for(const{r,c,s}of mine)if(s.t==='tower'&&s.n===1)for(const[a,b]of ALL8){const tr=r+a,tc=c+b;if(!inB(tr,tc))continue;const t=S.b[tr][tc];if(!t)A.push({k:'golem',from:[r,c],to:[tr,tc],mode:'move',cost:2});else if(t.o===o&&!S.shield[t.id])A.push({k:'golem',from:[r,c],to:[tr,tc],mode:t.t==='tower'?'destroy':'capture',cost:2});}
  if(art==='decree'&&L>=2)for(const{r,c,s}of mine)if(s.t==='knight'&&s.n===1)A.push({k:'decree',to:[r,c],cost:2});
  if(art==='banner')for(const{r,c,s}of mine)if(s.t==='knight'&&s.n===1&&canMove(S,s))expandMoves(S,A,r,c,pieceMoves(S,r,c,'banner'),'banner');
  if(art==='sellswords'){const gk=graveKnights(S,p);if(gk>0&&freeCamp(S,p)>0)for(const acts of[1,2])if(L>=acts&&(acts===1||gk>2)){A.push({k:'sell',acts,pairs:false,cost:acts});if(gk>=2)A.push({k:'sell',acts,pairs:true,cost:acts});}}
  if(art==='berserker'&&L>=2)for(const{r,c,s}of mine)if(s.t==='knight'&&s.n===1&&canMove(S,s))for(const to of bCaps(S,r,c))A.push({k:'berserk',from:[r,c],to,cost:2});
  if(art==='keg'&&L>=2)for(const{r,c,s}of mine)if(s.t==='knight')for(const[a,b]of ALL8){const tr=r+a,tc=c+b;if(!inB(tr,tc))continue;const t=S.b[tr][tc];if(t&&t.o===o&&t.t==='tower'&&!S.shield[t.id])A.push({k:'keg',from:[r,c],to:[tr,tc],cost:2});}
  if(art==='blink')for(const x of mine)if(x.s.t==='tower'||(x.s.t==='wizard'&&x.s.n===2))for(const y of mine)if(y.s!==x.s)A.push({k:'blink',from:[x.r,x.c],to:[y.r,y.c],cost:1});
  if(art==='flank')for(const{r,c,s}of mine)if(s.t==='knight'&&canMove(S,s))expandMoves(S,A,r,c,pieceMoves(S,r,c,'flank'),'flank');
  if(art==='shield')for(const{r,c,s}of mine)if(!S.shield[s.id])A.push({k:'shield',to:[r,c],cost:1});
}

/* ===================== APPLY ===================== */
function capture(S,p,x){const t=S.b[x[0]][x[1]];S.grave[p][t.o][t.t]+=t.n;delete S.shield[t.id];S.b[x[0]][x[1]]=null;return t;}
function promote(S){
  const msgs=[];
  for(const p of['w','b']){const r=backRow(opp(p));for(let c=0;c<8;c++){const s=S.b[r][c];if(s&&s.o===p&&s.t==='knight'&&s.n===1){s.t='noble';msgs.push(`${NAME[p]} knight on ${sq(r,c)} promotes to Noble`);}}}
  return msgs;
}
function checkEnd(S){
  if(S.winner)return;
  for(const p of[S.turn,opp(S.turn)]){if(nobleUnits(S,p)===0){S.winner=opp(p);S.result=`${NAME[opp(p)]} wins — every ${NAME[p]} noble has been captured.`;return;}}
  const lone=p=>{const st=stacks(S,p);return st.length===1&&st[0].s.t==='noble'&&st[0].s.n===1&&campCount(S,p)===0;};
  if(lone('w')&&lone('b')){S.winner='draw';S.result='Stalemate — each side has only a single noble. The game is a draw.';}
}
function freeCamp(S,p){let n=0;for(let c=0;c<8;c++)if(S.camp[p][c]===0&&!S.b[backRow(p)][c])n++;return n;}
function sellUnits(S,a){const want=Math.min(a.acts*2,graveKnights(S,S.turn));const u=[];if(a.pairs){for(let k=0;k+2<=want;k+=2)u.push(2);if(want%2)u.push(1);}else for(let k=0;k<want;k++)u.push(1);return u.slice(0,freeCamp(S,S.turn));}
function autoFiles(S,p,units){const cap=S.camp[p].slice(),order=[3,4,2,5,1,6,0,7],out=[],r=backRow(p);
  for(const u of units){const f=order.find(c=>cap[c]===0&&!S.b[r][c]);if(f===undefined){out.push(null);continue;}cap[f]+=u;out.push(f);}return out;}
function apply(S,a){
  const p=S.turn,o=opp(p),B=S.b;let t='';
  const at=x=>B[x[0]][x[1]];
  const use=(s,kind)=>{const u=S.used[s.id]||(S.used[s.id]={m:0,x:false});if(kind==='m')u.m++;else u.x=true;};
  const set=(x,v)=>{B[x[0]][x[1]]=v;};
  const march=s=>{if(s&&s.t==='knight'&&s.n===1){(S.marched||(S.marched={}))[s.id]=1;}};
  switch(a.k){
  case'move':case'banner':case'flank':{
    const s=at(a.from),pre=a.k==='banner'?'[War Banner] ':a.k==='flank'?'[Flank] ':'',nm=pname(s);
    if(a.mode==='portal'){const tw=at(a.tower);set(a.from,null);set(a.tower,null);set(a.exit,s);set(a.shift,tw);use(s,'m');march(s);
      t=`${pre}Tower Shift: ${nm} ${sq(...a.from)} passes through ${pname(tw)} ${sq(...a.tower)} to ${sq(...a.exit)}; ${pname(tw)} shifts to ${sq(...a.shift)}`;}
    else if(a.mode==='stack'){const ns={id:S.nextId++,o:p,t:s.t,n:2};set(a.from,null);set(a.to,ns);S.frozen[ns.id]=1;t=`${pre}${nm} ${sq(...a.from)} stacks onto ${sq(...a.to)} → ${pname(ns)}`;}
    else{let cap='';if(at(a.to)){const v=capture(S,p,a.to);cap=a.mode==='destroy'?' — destroys enemy Tower':` — captures ${pname(v)}`;}set(a.from,null);set(a.to,s);use(s,'m');march(s);t=`${pre}${nm} ${sq(...a.from)}→${sq(...a.to)}${cap}`;}
    if(a.k!=='move')S.artUsed[p]=true;
    if(a.k==='flank'){S.flankTurn=true;S.flankCount++;}
    break;}
  case'ranged':{const s=at(a.from),v=capture(S,p,a.to);use(s,'x');t=`${pname(s)} ${sq(...a.from)} ${p==='b'?'hurls a fireball':'calls lightning'} at ${sq(...a.to)} — ${v.t==='tower'?'destroys enemy Tower':'captures '+pname(v)}`;break;}
  case'unstack':{const s=at(a.from),nm=pname(s);const bot={id:S.nextId++,o:p,t:s.t,n:1},top={id:S.nextId++,o:p,t:s.t,n:1};
    set(a.from,bot);set(a.to,top);S.frozen[bot.id]=1;S.frozen[top.id]=1;t=`${nm} ${sq(...a.from)} unstacks; top ${pname(top)} placed on ${sq(...a.to)}`;break;}
  case'cavnoble':{const s=at(a.at);S.grave[p][p].knight++;const ns={id:S.nextId++,o:p,t:'noble',n:1};set(a.at,ns);S.frozen[ns.id]=1;t=`Promotion: Cavalry ${sq(...a.at)} becomes a Noble (top knight sacrificed)`;break;}
  case'totower':{S.reserve[p]--;const ns={id:S.nextId++,o:p,t:'tower',n:1};set(a.at,ns);S.frozen[ns.id]=1;t=`Noble ${sq(...a.at)} traded for a Wizard Tower`;break;}
  case'tonoble':{const s=at(a.at),nm=pname(s),units=(s.t==='wizard'&&s.n===2)?2:1;S.reserve[p]=Math.min(2,S.reserve[p]+units);const ns={id:S.nextId++,o:p,t:'noble',n:units};set(a.at,ns);S.frozen[ns.id]=1;t=`Restore: ${nm} ${sq(...a.at)} → ${pname(ns)} (tower${units>1?'s':''} return to reserve)`;break;}
  case'flip':{const s=at(a.at),nm=pname(s);const ns={id:S.nextId++,o:p,t:s.t==='tower'?'wizard':'tower',n:s.n===2?2:1};set(a.at,ns);S.frozen[ns.id]=1;t=`${nm} ${sq(...a.at)} flips → ${pname(ns)}`;break;}
  case'front':{const s=at(a.from);set(a.from,null);set(a.to,s);use(s,'m');march(s);t=`Front Line: ${pname(s)} ${sq(...a.from)} jumps to ${sq(...a.to)}`;break;}
  case'relay':{const x=at(a.from),y=at(a.to);set(a.from,y);set(a.to,x);use(x,'m');t=`${pname(x)} ${sq(...a.from)} swaps with ${pname(y)} ${sq(...a.to)}`;break;}
  case'archers':{const v=capture(S,p,a.to);S.artUsed[p]=true;t=`[Hidden Archers] shoot ${pname(v)} on ${sq(...a.to)}`;break;}
  case'golem':{const tw=at(a.from);let cap='';if(at(a.to)){const v=capture(S,p,a.to);cap=v.t==='tower'?' — destroys enemy Tower':` — captures ${pname(v)}`;}set(a.from,null);set(a.to,tw);S.artUsed[p]=true;t=`[Stone Golem] Tower ${sq(...a.from)}→${sq(...a.to)}${cap}`;break;}
  case'decree':{const s=at(a.to);s.t='noble';S.artUsed[p]=true;t=`[Royal Decree] Knight ${sq(...a.to)} promoted to Noble`;break;}
  case'sell':{const units=sellUnits(S,a);
    const files=a.files&&a.files.length===units.length?a.files:autoFiles(S,p,units);const placed=[];
    units.forEach((u,ix)=>{const f=files[ix];if(f===undefined||f===null)return;for(let k=0;k<u;k++)takeKnight(S,p);S.camp[p][f]+=u;placed.push(`${u===2?'Cavalry':'Knight'}→${FILES[f]}`);});
    S.artUsed[p]=true;t=`[Sellswords] recruit to camp: ${placed.join(', ')}`;break;}
  case'berserk':case'bstep':{const s=at(a.from),v=capture(S,p,a.to);set(a.from,null);set(a.to,s);use(s,'m');march(s);if(a.k==='berserk'){S.artUsed[p]=true;S.berserk={id:s.id};}
    t=`[Berserker] Knight ${sq(...a.from)}→${sq(...a.to)} — captures ${pname(v)}`;break;}
  case'bstop':S.berserk=null;t='[Berserker] stops';break;
  case'keg':{const s=at(a.from);S.grave[p][p].knight+=s.n;set(a.from,null);capture(S,p,a.to);S.artUsed[p]=true;t=`[Powder Keg] ${pname(s)} ${sq(...a.from)} sacrificed — enemy Tower ${sq(...a.to)} destroyed`;break;}
  case'blink':{const x=at(a.from),y=at(a.to);set(a.from,y);set(a.to,x);use(y,'x');S.artUsed[p]=true;t=`[Blink Rune] ${pname(x)} ${sq(...a.from)} swaps with ${pname(y)} ${sq(...a.to)}`;break;}
  case'shield':{const s=at(a.to);S.shield[s.id]=p;S.artUsed[p]=true;t=`[Shield Wall] ${pname(s)} ${sq(...a.to)} shielded until ${NAME[p]}'s next turn`;break;}
  }

}
function legalActions(S){
  const p=S.turn;
  return gen(S).filter(a=>{
    const noblesBefore=nobleStacks(S,p).length;
    const T=clone(S);apply(T,a);
    if(T.winner===p)return true;
    const leavesDanger=checkApplies(T,p)&&inDanger(T,p);
    if(!leavesDanger)return true;
    // A noble may become a tower while any other noble of yours remains anywhere on the board.
    // If that leaves the other one in danger, a later action this turn must be able to save it.
    if(a.k==='totower'&&noblesBefore>1&&T.actionsLeft>0&&legalActions(T).length>0)return true;
    return false;

}

/* ===================== TURN FLOW ===================== */
function startTurn(S){
  const p=S.turn;S.used={};S.frozen={};S.landed={};S.recruitedTurn=0;S.arrivals=[];S.flankTurn=false;S.flankCount=0;S.berserk=null;
  for(const id in S.shield)if(S.shield[id]===p)delete S.shield[id];
  S.actionsLeft=S.first[p]?1:2;
  S.phase='play';
  const r=backRow(p);
  for(let c=0;c<8;c++){const n=S.camp[p][c];if(!n)continue;
    if(!S.campNote)S.campNote={w:[0,0,0,0,0,0,0,0],b:[0,0,0,0,0,0,0,0]};
    if(!S.b[r][c]){const nk={id:S.nextId++,o:p,t:'knight',n};S.b[r][c]=nk;S.landed[nk.id]=1;S.arrivals.push([r,c]);S.camp[p][c]=0;S.campNote[p][c]=0;S.log.push(`T${S.turnNo} ${NAME[p]}: camp ${n===2?'Cavalry':'Knight'} lands on ${sq(r,c)}`);}
    else S.log.push(`T${S.turnNo} ${NAME[p]}: camp square ${FILES[c]} is blocked — recruit waits until ${sq(r,c)} is clear`);}
  evalStart(S);
}
function evalStart(S){
  checkEnd(S);if(S.winner)return;
  const p=S.turn;
  if(checkApplies(S,p)&&inDanger(S,p)&&legalActions(S).length===0){S.winner=opp(p);S.result=`Checkmate — ${NAME[p]}'s last noble cannot escape danger. ${NAME[opp(p)]} wins.`;}
}
function placeCamp(S,i,c){
  const p=S.turn,e=S.camp[p].splice(i,1)[0];const r=backRow(p);
  const np={id:S.nextId++,o:p,t:'knight',n:e.n};S.b[r][c]=np;S.frozen[np.id]=1;
  S.log.push(`T${S.turnNo} ${NAME[p]}: camp ${e.n===2?'Cavalry':'Knight'} arrives on ${sq(r,c)} (frozen until next turn)`);
  if(!S.camp[p].length||!openBack(S,p).length){S.phase='play';evalStart(S);}
}
function posKey(S){return S.b.map(r=>r.map(x=>x?x.o+x.t[0]+x.n:'.').join('')).join('/')+S.turn;}
function endTurn(S){S.recent=(S.recent||[]).concat(posKey(S)).slice(-16);S.first[S.turn]=false;S.turn=opp(S.turn);S.turnNo++;
  if(S.rules&&S.rules.turnLimit&&S.turnNo>S.rules.turnLimit&&!S.winner){const nw=nobleUnits(S,'w'),nb=nobleUnits(S,'b');S.winner=nw>nb?'w':nb>nw?'b':'draw';S.result=`Turn limit (${S.rules.turnLimit}) reached — nobles left: White ${nw}, Black ${nb}. `+(S.winner==='draw'?'Draw.':`${NAME[S.winner]} wins with more nobles.`);return;}
  startTurn(S);}

function pieceName(s){return s.t==='knight'?(s.n===2?'cavalry':'knight'):s.t==='noble'?(s.n===2?'king':'noble'):s.t==='wizard'?(s.n===2?'archmage':'wizard'):(s.n===2?'atower':'tower');}
function pieceFile(s){

}

/* ===================== COMPUTER OPPONENT ===================== */
const VAL={knight:[1,3],noble:[5,7],wizard:[5,6],tower:[5,5]}; // the computer's private piece weights for judging positions (not a player-facing points system)
const val=s=>VAL[s.t][s.n-1];
const ART_KEEP={easy:0.3,medium:1.5,hard:2.5}; // value of still holding the artifact: higher = waits for a stronger moment
const CAPK=['ranged','archers','golem','berserk','bstep','keg'];
function cover(S,r,c){ // squares this piece could capture on if an enemy stood there
  const s=S.b[r][c],p=s.o,f=fwd(p),o=[];
  const slide=(dirs,max)=>{for(const[dr,dc]of dirs)for(let k=1;k<=max;k++){const rr=r+dr*k,cc=c+dc*k;if(!inB(rr,cc))break;o.push(rr*8+cc);if(S.b[rr][cc])break;}};
  if(s.t==='knight'&&s.n===1){for(const dc of[-1,1])if(inB(r+f,c+dc))o.push((r+f)*8+c+dc);}
  else if(s.t==='knight')slide(DIAG,3);
  else if(s.t==='noble'&&s.n===1)slide(ORTH,3);
  else if(s.t==='noble')slide(ALL8,1);
  else if(s.t==='wizard'){for(const[dr,dc]of LJ)if(inB(r+dr,c+dc))o.push((r+dr)*8+c+dc);if(inB(r+f,c))o.push((r+f)*8+c);}
  return o;
}
function coverInfo(S,p){const m=new Map();let mob=0;for(const{r,c,s}of stacks(S,p)){if(s.t==='tower')continue;const v=val(s),cv=cover(S,r,c);mob+=cv.length;for(const k of cv)if(!m.has(k)||m.get(k)>v)m.set(k,v);}return{m,mob};}
const coverMap=(S,p)=>coverInfo(S,p).m;
function evalS(S,me,level='hard'){
  if(S.winner)return S.winner===me?1e6:S.winner==='draw'?0:-1e6;
  const pos=level!=='easy';
  const CI={w:coverInfo(S,'w'),b:coverInfo(S,'b')};
  const next=(S.actionsLeft>0||S.berserk)?S.turn:opp(S.turn);
  let sc=0;
  for(const p of['w','b']){
    const sg=p===me?1:-1,o=opp(p),mine=stacks(S,p),theirs=stacks(S,o),atk=CI[o].m,def=CI[p].m;
    for(const{r,c,s}of mine){
      let v=val(s);
      if(pos){
        const adv=p==='w'?7-r:r;
        if(s.t==='knight'){
          v+=0.08*adv*s.n;
          if(s.n===1){const f=fwd(p);let passed=true;for(const x of theirs)if(Math.abs(x.c-c)<=1&&(x.r-r)*f>0){passed=false;break;}if(passed)v+=0.5*adv/6;if(adv===6)v+=1.2;}
        }
        if(r>=2&&r<=5&&c>=2&&c<=5&&s.t!=='tower')v+=0.12;
        if(S.shield[s.id])v+=0.3;
      }
      sc+=sg*v;
    }
    sc+=sg*(0.9*campCount(S,p)+0.6*S.reserve[p]+0.15*graveKnights(S,p)+(S.art[p]&&!S.artUsed[p]?ART_KEEP[level]:0));
    if(pos){
      sc+=sg*0.03*CI[p].mob;
      const en=nobleStacks(S,o);
      if(en.length)for(const{r,c,s}of mine){if(s.t==='tower')continue;const d=Math.min(...en.map(n=>Math.max(Math.abs(n.r-r),Math.abs(n.c-c))));sc+=sg*0.07*(7-d);}
      // noble safety and pressure: the real objective
      const ns=nobleStacks(S,p),single=ns.length===1;
      for(const n of ns){
        const k=n.r*8+n.c;let near=0,guards=0;
        for(const x of theirs)if(Math.max(Math.abs(x.r-n.r),Math.abs(x.c-n.c))<=2)near++;
        for(const x of mine)if(x.s!==n.s&&Math.max(Math.abs(x.r-n.r),Math.abs(x.c-n.c))<=1)guards++;
        let pen=0.3*near-0.15*Math.min(guards,3);
        if(atk.has(k)&&!S.shield[n.s.id])pen+=(single?4:1.2*n.s.n)*(def.has(k)?0.6:1);
        if(single){let esc=0;for(const mv of pieceMoves(S,n.r,n.c,'normal'))if(!atk.has(mv.to[0]*8+mv.to[1]))esc++;pen+=esc===0?2.5:-0.2*Math.min(esc,5);pen+=1.5;}
        sc-=sg*pen;
      }
    }else if(nobleUnits(S,p)===1)sc-=sg*3;
    // hanging pieces, weighted by who moves next
    const losses=[];
    for(const{r,c,s}of mine){
      const k=r*8+c;if(S.shield[s.id]||(pos&&s.t==='noble'))continue;
      if(s.t==='tower'){if(!theirs.some(x=>x.s.t==='wizard'&&x.s.n===2&&cover(S,x.r,x.c).includes(k)))continue;}
      if(!atk.has(k))continue;
      const loss=val(s)-(def.has(k)?atk.get(k):0);if(loss>0)losses.push(loss);
    }
    losses.sort((a,b)=>b-a);
    const w1=next===o?0.9:0.25,w2=next===o?0.5:0.1;
    sc-=sg*((losses[0]||0)*w1+(losses[1]||0)*w2);
  }
  return sc;
}
function afterVal(S,a,me,level){const T=clone(S);apply(T,a);return{T,a,v:evalS(T,me,level)};}
function quickScore(S,a,side){ // cheap ordering of replies: captures first (nobles above all), then moves closing in on enemy nobles
  let v=0;const tgt=a.to&&S.b[a.to[0]]&&S.b[a.to[0]][a.to[1]];
  if(tgt&&tgt.o!==side&&(a.mode==='capture'||a.mode==='destroy'||CAPK.includes(a.k)))v+=10*val(tgt)+(tgt.t==='noble'?40:0);
  if(a.from&&a.to&&!tgt){const en=nobleStacks(S,opp(side));if(en.length){const d=x=>Math.min(...en.map(n=>Math.max(Math.abs(n.r-x[0]),Math.abs(n.c-x[1]))));v+=0.8*(d(a.from)-d(a.to));}}
  return v;
}
function replyValue(T,me){ // opponent answers with its best reply turn (up to 2 actions); value from me's side (worst case)
  if(T.winner)return evalS(T,me,'hard');
  const R=clone(T);R.berserk=null;if(R.turn===me){R.first[me]=false;R.turn=opp(me);R.turnNo++;startTurn(R);}
  if(R.winner)return evalS(R,me,'hard');
  const side=R.turn;
  const pick=(X,n)=>gen(X).filter(a=>a.k!=='bstop').map(a=>({a,q:quickScore(X,a,side)})).sort((x,y)=>y.q-x.q).slice(0,n).map(x=>x.a);
  let worst=evalS(R,me,'hard');
  for(const a1 of pick(R,6)){
    const T1=clone(R);apply(T1,a1);let g=0;while(T1.berserk&&g++<6){const st=gen(T1).find(x=>x.k==='bstep');if(!st)break;apply(T1,st);}T1.berserk=null;
    let v=evalS(T1,me,'hard');
    if(!T1.winner&&T1.actionsLeft>0)for(const a2 of pick(T1,4)){const T2=clone(T1);apply(T2,a2);T2.berserk=null;v=Math.min(v,evalS(T2,me,'hard'));}
    worst=Math.min(worst,v);
  }
  return worst;
}
function repPen(S,T){const k=posKey(T);return (S.recent||[]).filter(x=>x===k).length*2.5;}
function botChoose(S,level){
  const me=S.turn,L=legalActions(S);
  if(!L.length)return null;
  if(level==='easy'){ // mostly grabs points, sometimes careless
    if(S.berserk)return L.find(a=>a.k==='bstep')||L[0];
    if(Math.random()<0.3)return L[Math.floor(Math.random()*L.length)];
    return L.map(a=>({a,v:afterVal(S,a,me,'easy').v+Math.random()*1.5})).sort((x,y)=>y.v-x.v)[0].a;
  }
  const sc=L.map(a=>afterVal(S,a,me,level)).sort((x,y)=>y.v-x.v);
  if(S.berserk)return sc[0].a;
  if(level==='medium'){ // plans both of its actions together; judges position, noble safety and threats
    let best=sc[0],bv=-Infinity;
    for(const c of sc.slice(0,8)){
      let v=c.v;
      v-=repPen(S,c.T);
      if(!c.T.winner&&c.T.actionsLeft>0&&!c.T.berserk)for(const a2 of legalActions(c.T)){const r=afterVal(c.T,a2,me,level);const rv=r.v-repPen(S,r.T);if(rv>v)v=rv;}
      v+=Math.random()*0.15;
      if(v>bv){bv=v;best=c;}
    }
    return best.a;
  }
  // hard: plans both actions, then checks each plan against the opponent's best reply turn
  let best=sc[0],bv=-Infinity;
  for(const c of sc.slice(0,8)){
    let v;
    if(c.T.winner)v=evalS(c.T,me,level);
    else{
      const blend=(T,st)=>0.45*st+0.55*replyValue(T,me)-repPen(S,T); // own plan quality, checked against the opponent's best reply
      v=blend(c.T,c.v);
      if(c.T.actionsLeft>0&&!c.T.berserk){
        const L2=legalActions(c.T).map(a=>afterVal(c.T,a,me,level)).sort((x,y)=>y.v-x.v).slice(0,7);
        for(const d of L2){const rv=d.T.winner?evalS(d.T,me,level):blend(d.T,d.v);if(rv>v)v=rv;}
      }
    }
    v+=Math.random()*0.1; // slight variety so Hard doesn't replay identical games
    if(v>bv){bv=v;best=c;}
  }
  return best.a;
}
const BOT_ART=['archers','berserker','banner','shield','decree','blink','sellswords','flank','keg','golem'];
function botPickArt(S,level){const free=ART.map(a=>a.id).filter(id=>S.art.w!==id&&S.art.b!==id);if(level==='easy')return free[Math.floor(Math.random()*free.length)];return BOT_ART.find(id=>free.includes(id));}
let botToken=0;
function scheduleBot(){
  const tok=++botToken;
  if(S.winner||paused)return;
  if(S.phase==='pick'&&S.mode.ai[S.picker]){setTimeout(()=>{if(tok!==botToken||paused)return;pickArt(botPickArt(S,S.mode.ai[S.picker]));},600);return;}
  if(S.phase!=='play'||!S.mode.ai[S.turn])return;
  const level=S.mode.ai[S.turn];
  setTimeout(()=>{
    if(tok!==botToken||paused)return;
    if(S.actionsLeft<=0&&!S.berserk){doEndTurn();return;}
    const a=botChoose(S,level);
    if(tok!==botToken)return;
    if(!a){if(S.berserk){const st=LEG.find(x=>x.k==='bstop');if(st){doAction(st);return;}}doEndTurn();return;}
    doAction(a);
  },(S.mode.ai.w&&S.mode.ai.b)?watchDelay:(level==='hard'?350:600));
}
const botTurn=()=>!!(S.mode.ai[S.turn]&&S.phase==='play'&&!S.winner);
let paused=false,watchDelay=900;
const isAI=p=>!!S.mode.ai[p];

function rbBoard(N,items,opt={}){
  const cl=opt.cl||26,W=N*cl;let g='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)g+=`<rect x="${c*cl}" y="${r*cl}" width="${cl}" height="${cl}" fill="${(r+c)%2?'#9a6a3a':'#ecd9ab'}"/>`;
  const C=v=>v*cl+cl/2;
  for(const it of items){
    const x=it.c*cl,y=it.r*cl;
    if(it.shade)g+=`<rect x="${x}" y="${y}" width="${cl}" height="${cl}" fill="${it.shade}"/>`;
    if(it.s)g+=mini(it.s,x-4,y-5,cl+8);
    if(it.m==='dot')g+=`<circle cx="${C(it.c)}" cy="${C(it.r)}" r="${cl*.17}" fill="#2f7a2f"/>`;
    if(it.m==='dot2')g+=`<circle cx="${C(it.c)}" cy="${C(it.r)}" r="${cl*.17}" fill="none" stroke="#2f7a2f" stroke-width="2.5"/>`;
    if(it.m==='cap')g+=`<circle cx="${C(it.c)}" cy="${C(it.r)}" r="${cl*.44}" fill="none" stroke="#c0262b" stroke-width="3"/>`;
    if(it.m==='stk')g+=`<rect x="${x+2}" y="${y+2}" width="${cl-4}" height="${cl-4}" rx="4" fill="none" stroke="#2a5fbf" stroke-width="3"/>`;
    if(it.m==='por')g+=`<rect x="${x+2}" y="${y+2}" width="${cl-4}" height="${cl-4}" rx="4" fill="none" stroke="#7b3cc0" stroke-width="3" stroke-dasharray="4 3"/>`;
    if(it.m==='ex')g+=`<circle cx="${C(it.c)}" cy="${C(it.r)}" r="${cl*.17}" fill="#7b3cc0"/>`;
    if(it.m==='bolt')g+=`<path d="M${C(it.c)+2} ${y+3} L${C(it.c)-5} ${C(it.r)+1} L${C(it.c)+1} ${C(it.r)+1} L${C(it.c)-3} ${y+cl-3}" stroke="#e0a000" stroke-width="3" fill="none"/>`;
  }
  for(const[a,b,c2,d,col]of(opt.arrows||[]))g+=`<line x1="${C(b)}" y1="${C(a)}" x2="${C(d)}" y2="${C(c2)}" stroke="${col||'#2f7a2f'}" stroke-width="3" marker-end="url(#rbh-${(col||'#2f7a2f').slice(1)})" ${opt.dash?'stroke-dasharray="5 3"':''}/>`;
  if(opt.arc){const [a,b,c2,d]=opt.arc;const x1=C(b),y1=C(a),x2=C(d),y2=C(c2);g+=`<path d="M${x1} ${y1} Q${(x1+x2)/2+cl*0.95} ${(y1+y2)/2} ${x2} ${y2}" fill="none" stroke="#2f7a2f" stroke-width="3" marker-end="url(#rbh-2f7a2f)"/>`;}
  const defs=['2f7a2f','c0262b','7b3cc0','2a5fbf'].map(c=>`<marker id="rbh-${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#${c}"/></marker>`).join('');
  return `<svg viewBox="0 0 ${W} ${W}" style="width:${Math.min(W,220)}px;max-width:100%;border:2px solid #3b2918" aria-hidden="true"><defs>${defs}</defs>${g}</svg>`;
}

  const ch=(id,n,t)=>`<h3 id="rb-${id}"><span class="orn">❦</span> ${n}. ${t}</h3>`;
  const toc=[['play','The Game'],['board','The Board'],['setup','Setup'],['turns','Turns and Actions'],['pieces','The Pieces'],['stack','Stacking and Unstacking'],['prestige','Prestige: Promotion, Towers and Restore'],['portal','Tower Shift'],['recruit','Recruiting and the Camp'],['check','Check and Desperate Measures'],['win','Winning and Drawing'],['art','The Artifacts'],['ref','Quick Reference']];
  let h=`<div class="rb"><h2 class="rbt">⚜ The Book of Strahtura ⚜</h2><p class="rbs">Strahtura <i>(strah-TOO-rah)</i> · Rules for Play Strahtura v1.02</p>
  <p class="dc"><b>New in v1.02.</b> A knight may retreat one square straight back, without capturing, onto an empty square, onto your own knight, or into your own tower or archmage. Front Line lets that knight jump the single knight directly ahead. An archmage may flip into an Archmage's Tower, which swaps with a friendly piece beside it and cannot be promoted. Stone Golem moves only a single Wizard Tower. Settings opened during a match close with the ✕ at the top right.</p>
  <nav class="rbtoc">${toc.map(([id,t],i)=>`<a data-rb="${id}">${['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII'][i]}. ${t}</a>`).join('')}</nav>`;
  h+=ch('play','I','The Game')+`<p class="dc">Two empires meet on an eight-by-eight field. Each begins with fourteen knights and two nobles. Every piece is the same carved helm: stand it one way and it is a knight; turn it over and it is a crowned noble. Through stacking, flipping and trading, an empire gives up numbers to raise mightier pieces. This is <b>prestige</b>: fewer pieces, greater power.</p><p>You win by capturing <b>every enemy noble</b>. A king is two nobles, so both must fall.</p>`;
  h+=ch('board','II','The Board')+`<p class="dc">Play on a standard 8×8 board. Off the board each side keeps:</p><ul><li><b>A camp</b>: eight dotted squares behind your back row, one behind each file, where recruits wait.</li><li><b>A half of the graveyard</b>: one large rectangle split in two. Pieces you capture go in <i>your</i> half; pieces you sacrifice go in your own half too.</li><li><b>An artifact square</b> with its card behind it, and behind that <b>two tower squares</b> showing how many Wizard Towers you can still raise.</li></ul>`;
  h+=ch('setup','III','Setup')+`<div class="rbp"><div>${RB.setup}</div><div><p class="dc">Each side fills its back two rows. The two nobles stand on the d and e files of the back row, where a chess king and queen would stand; knights fill every other square.</p><p><b>Black chooses an artifact first</b>, then White. There is only one of each, so the sides always hold different artifacts. <b>White moves first.</b></p></div></div>`;
  h+=ch('turns','IV','Turns and Actions')+`<ul><li>Your <b>first turn</b> has only <b>1 action</b>, and you may not stack or use your artifact on it; every turn after has <b>2</b>. Spend them in any mix.</li><li>Two moves must be made by <b>two different pieces</b>, except the king and a last-stand knight (see X).</li><li>You may <b>recruit at most once per turn</b> (only the Sellswords artifact brings more).</li><li>Each piece takes <b>one piece-action per turn</b>: a move, a ranged attack, a flip, an unstack or a trade.</li><li>Knights, cavalry, nobles and kings do not jump over pieces. A wizard and an archmage jump in an L. Front Line lets a knight jump the single knight directly in front of him.</li><li>You may end your turn early and give up unused actions, except while your last noble is in danger.</li><li><b>Frozen ❄</b>: a piece just stacked, unstacked, flipped or traded cannot move, attack or act again this turn. You also cannot stack onto a frozen piece. A king is the exception: while an action remains, the king is not frozen.</li></ul>`;
  h+=ch('pieces','V','The Pieces')+
   rbPiece('Knight',`<div>${RB.knight}<p class="hint" style="text-align:center">Left knight: forward, capture, and the green retreat dot behind him. Right knight: Front Line.</p></div>`,`<p>Moves 1 square forward. From your first or second row, on its first move, it may move 2 forward if both squares are open (1 action). It may <b>retreat</b> 1 square straight back onto an empty square, onto your own single knight, or into your own tower or archmage. A retreat never captures. Captures 1 square diagonally forward. <b>Front Line</b> jumps the single knight directly ahead and lands on the empty square beyond. It does not capture. On that knight's first move, while it is still on your first or second row, Front Line costs 1 action. After the knight has moved once, Front Line costs 2 actions. On reaching the enemy's back row a single knight is <b>automatically promoted</b> to a noble.</p>`)+
   rbPiece('Cavalry (2 knights)',RB.cavalry,`<p>Moves and captures diagonally, up to 3 squares. A cavalry does not promote. Unstack it on the enemy back row and each single knight there promotes.</p>`)+
   rbPiece('Noble',RB.noble,`<p>Moves and captures straight, up to 3 squares.</p>`)+
   rbPiece('King (2 nobles)',RB.king,`<p>Moves and captures 1 square in any direction, and <b>may move twice in one turn</b> using both actions. A king is never frozen while an action remains, so two nobles may join and the king can still step that turn. A king counts as two nobles.</p>`)+
   rbPiece('Wizard Tower',`<div>${RB.portal}<p class="hint" style="text-align:center">Step onto the plain tower from a touching square, then out to one open square touching it. No further move.</p></div>`,`<p>Raised by trading a noble (VII). This is the plain tower, with an ordinary door. It never moves on its own and <b>cannot be captured</b>, except by an archmage or an artifact. Stone Golem can move only this single tower.</p><p>A piece that can reach the tower may step onto it and then out, in the same action. The way out is only an <b>open square touching the tower</b>. That step does not finish a longer move. It cannot capture, stack, or land on another tower.</p>`)+
   rbPiece('Wizard',RB.wizard,`<p>Jumps in an L, like a chess knight, and captures where it lands. <b>Or</b>, instead of moving, it strikes the square directly in front of it: Black hurls a fireball, White calls lightning (1 action). A wizard either moves or strikes in a turn, never both.</p>`)+
   rbPiece('Archmage (2 wizards)',RB.archmage,`<p>Two wizards stacked. It moves and strikes like a wizard, and pieces may Tower Shift through it. It unstacks back into <b>two wizards</b>. It can destroy an enemy Wizard Tower or an Archmage's Tower, by striking it or by moving onto it. It may <b>flip</b> into an Archmage's Tower. It does not place a wizard down as a tower.</p>`)+
   rbPiece("Archmage's Tower",`<div><img class="big" src="art/sprites/woodcut/w-atower.png" alt="Fulgar Archmage's Tower" style="height:140px;width:auto"><img src="art/sprites/woodcut/b-atower.png" alt="Angtapa Archmage's Tower" style="height:140px;width:auto">${RB.atower}<p class="hint" style="text-align:center">The larger tower. The door is the portal. Unstack it into two plain towers.</p></div>`,`<p>An archmage flipped over. It is larger than a Wizard Tower, and the door is the portal. It does not step to an empty square. It swaps places with one of your own pieces on a touching square (1 action). It <b>unstacks into two plain Wizard Towers</b>, the same way any stack unstacks: one stays, the other goes to an open square beside it, and both are frozen. Flip it back into an archmage if you would rather. It cannot capture, and it cannot be promoted or restored into a noble or a king. Stone Golem cannot move it. An archmage or the Powder Keg can destroy it.</p>`)+
   `<p>Any piece may capture any enemy piece or stack, except a tower. A captured stack goes to the graveyard whole.</p>`;
  h+=ch('stack','VI','Stacking and Unstacking')+`<div class="rbp"><div>${RB.stack}</div><div><p class="dc">Move a piece onto a matching piece of your own to stack them, using its normal move. Knights stack forward, diagonally forward, or straight back. Knight + knight = cavalry, noble + noble = king, wizard + wizard = archmage. A stack holds at most 2, and a new stack is frozen this turn, except a king while an action remains.</p><p><b>Unstacking</b> (1 action) places one piece of the stack on any open square touching it. Both pieces stay the same kind: an archmage becomes two wizards, and an Archmage's Tower becomes two plain Wizard Towers. It cannot capture, and both pieces are frozen this turn. <i>Double-tap or long-press a stack.</i></p></div></div>`;
  h+=ch('prestige','VII','Prestige: Promotion, Towers and Restore')+`<p class="dc">Each trade costs 1 action, happens on the piece's own square, and leaves the new piece frozen.</p><ul><li><b>Promotion (Cavalry → Noble)</b>: only while the cavalry stands in the <b>enemy's half</b> of the board (the four rows nearest your opponent). Prestige is earned in battle. The top knight is sacrificed to your graveyard half (it can be recruited again); the bottom knight turns over as a noble.</li><li><b>Trade limit</b>: no trade into a noble (Cavalry → Noble, Tower or Wizard → Noble, Archmage → King) may leave you with more than <b>4 nobles</b> on the board, counting a king as 2. Promotion on the back row and Royal Decree are never limited. Flips, stacking, unstacking and Noble → Tower are not affected.</li><li><b>Noble → Wizard Tower</b>: only while a tower remains in your reserve, at most two per game. You may <b>never trade your last noble</b>. Any other noble of yours, anywhere on the board, is enough. If the trade leaves that noble in danger, your next action must get it out.</li><li><b>Restore</b>: a Tower or Wizard back to a Noble, an Archmage back to a King: the towers return to your reserve and can be raised again later.</li><li><b>Flip</b> a single tower to a wizard, a wizard to a tower, an archmage to an Archmage's Tower, or that tower back to an archmage (1 action). A flipped piece cannot move, strike, swap or stack that turn. An Archmage's Tower cannot be restored into a king.</li></ul><p>A tower, wizard or archmage that is captured or destroyed goes to the graveyard, and that tower can never be raised again.</p>`;
  h+=ch('portal','VIII','Tower Shift')+`<div class="rbp"><div>${RB.portal}</div><div><p class="dc">A piece steps onto your tower or archmage from a square it can reach, then out again, all in one action. The way out is only an <b>open square touching the tower</b>. Purple marks those squares. It is not the rest of the piece's move, and it does not travel any farther. It cannot capture, stack, or land on a tower. The shaded square is the one the piece left: the tower shifts back onto it. If that square is occupied or off the board, the piece cannot enter from that direction. Enemies can never Tower Shift through yours.</p></div></div><div class="rbp"><div>${RB.portalL}</div><div><p>A diagonal step in is the same. The piece is already touching the tower. It steps on, then out to one open touching square. It does not keep going.</p></div></div>`;
    h+=ch('recruit','IX','Recruiting and the Camp')+`<div class="rbp"><div>${RB.camp}</div><div><p class="dc">Once per turn, recruiting (1 action) brings back one of <b>your own fallen knights</b>, captured or sacrificed, to an empty camp square of your choice, in full view of your opponent. You can only recruit knights that are actually in the graveyard, and only onto a camp square whose back-row square is <b>empty when you recruit</b>. One knight per camp square: only the Sellswords artifact can bring a cavalry pair, and it follows the same empty-square rule.</p><p>At the start of your next turn every recruit lands on the back-row square in front of its camp square and <b>may move and capture at once</b>, but it <b>cannot stack or be stacked onto</b> on the turn it lands. If something moves onto that square before then, the recruit waits in camp until it is clear. Pieces in camp cannot be captured.</p></div></div>`;
  h+=ch('check','X','Check and Desperate Measures')+`<div class="rbp"><div>${RB.check}</div><div><p class="dc">Check applies only when an empire is down to <b>one noble piece</b>: a single noble or a king. That piece may never end in danger, meaning it could be captured by one enemy action. If it begins your turn in danger, your next action must end the danger by any means: move it, capture the attacker, block, or use an artifact. If nothing can, it is <b>checkmate</b> and you lose. With two or more noble pieces, check does not apply.</p></div></div><ul><li>A last noble moves only once per turn like any other noble, but you may still use your other action to recruit, use your artifact, or move another piece.</li><li><b>Last stand</b>: with only one noble and one knight left, that knight may move twice in one turn.</li></ul>`;
  h+=ch('win','XI','Winning and Drawing')+`<ul><li>Capture every enemy noble and you win. A king counts as two.</li><li>If each side has only a single noble and nothing else, the game is a <b>stalemate</b> and a draw.</li><li><b>Tournament rule: turn limit (optional, off by default)</b>: after 100 turns, 50 each, the side with more nobles on the board wins (a king counts as 2). Equal nobles is a draw.</li><li><b>Game options</b> (setup screen): Artifacts on or off; Move hints as Tutorial (move dots shown) or Fog of war (no hints; the danger pulse on a last noble still shows).</li><li><b>Tournament rule: timed games</b> (10, 20 or 30 minutes per game) split the time evenly; your clock runs only on your turns. If your clock reaches zero, you lose.</li></ul>`;
  h+=ch('art','XII','The Artifacts')+`<p class="dc">Each side holds one artifact, shown as a figurine with its card. Artifacts cannot be used on your first turn. Once used, the figurine returns to the treasure box and its card to the card box.</p><div class="grid3">`+ART.map(a=>`<div class="card"><div class="nm">${a.name}</div>${artArt(a.id)}<div class="fg">Figurine: ${a.fig}</div><div class="cs">${a.cost}</div><div class="tx">${a.text}</div></div>`).join('')+`</div>`;
  h+=ch('ref','XIII','Quick Reference')+`<table class="rbq"><tr><th>Piece</th><th>Move</th><th>Capture</th></tr>
  <tr><td>Knight</td><td>1 forward; 2 forward on its first move from rows 1–2; 1 straight back; Front Line</td><td>1 diagonally forward. Retreat and Front Line do not capture</td></tr>
  <tr><td>Cavalry</td><td colspan="2">Diagonal, up to 3</td></tr>
  <tr><td>Noble</td><td colspan="2">Straight, up to 3</td></tr>
  <tr><td>King</td><td colspan="2">1 any direction; may move twice</td></tr>
  <tr><td>Wizard</td><td>L-jump</td><td>L-jump, or strike 1 ahead</td></tr>
  <tr><td>Archmage</td><td>L-jump; unstack into two wizards; flip into an Archmage's Tower</td><td>As wizard; destroys either tower</td></tr>
  <tr><td>Archmage's Tower</td><td>Swap with an adjacent friendly piece; unstack into two plain towers</td><td>Cannot capture or be promoted. Destroyed like a tower</td></tr>
  <tr><td>Tower</td><td colspan="2">Never moves on its own; Stone Golem may step a single tower; cannot be captured</td></tr></table>
  <table class="rbq" style="margin-top:10px"><tr><th>Prestige action</th><th>What it does</th></tr>
  <tr><td>Promotion</td><td>Knight on the enemy back row becomes a noble (always). Cavalry in the enemy half becomes a noble (1 action, top knight sacrificed, trade limit 4)</td></tr>
  <tr><td>Noble → Tower</td><td>Noble trades for a Wizard Tower from your reserve (1 action, max 2 towers)</td></tr>
  <tr><td>Restore</td><td>Tower or wizard back to a noble, archmage back to a king (1 action, trade limit 4)</td></tr>
  <tr><td>Tower Shift</td><td>Pass through your tower or archmage to an open square beside it; the tower shifts back</td></tr>
  <tr><td>Recruit</td><td>One fallen knight per turn to an open camp square</td></tr></table>`;
  return h+'</div>';
}


/* ===================== LORE ===================== */
function lorePage(){
  const king=(o)=>{const src=o==='w'?'art/lore/fulgar-king.jpg':'art/lore/angtapa-king.jpg';const name=o==='w'?'King of Fulgar':'King of Angtapa';return `<div class="loreking" title="${name}"><img src="${src}" alt="${name}"></div>`;};
  return `<div class="rb lore"><h2 class="rbt">⚜ The Kings' Accord ⚜</h2><p class="rbs">How Strahtura <i>(strah-TOO-rah)</i> ended the Long War</p>
  <div class="lorekings">${king('w')}<span style="font-family:Cinzel;font-size:22px;color:#8a2020">⚔</span>${king('b')}</div>
  <p class="rbs" style="margin-top:0"><b>The Fulgar Empire</b> (White, the lightning) &nbsp;·&nbsp; <b>The Angtapa Empire</b> (Black, the fire)</p>

  <h3><span class="orn">❦</span> I. The Long War</h3>
  <p class="dc">Two empires faced each other across a single valley. To the west stood the <b>Fulgar Empire</b>, whose name in its old tongue means <i>lightning</i>. Its court wizards called down storms from the white cliffs. To the east stood the <b>Angtapa Empire</b>, named in its sacred tongue for <i>agni</i>, fire, and <i>tapas</i>, the inner heat of discipline. Its sages hurled flame from the black hills.</p>
  <p>For three generations the two empires made war. Grandfathers fell, then fathers, and in the end sons were sent to die over fields no one living could remember the reason for. Each spring the armies met, each autumn they counted the dead, and each winter both empires grew poorer. In the war's ninetieth year a harvest failed on both sides of the valley. Neither king could feed another campaign, and neither would be the first to kneel.</p>

  <h3><span class="orn">❦</span> II. The Two Kings Meet</h3>
  <p class="dc">Under a white flag, in a ruined chapel at the valley's heart, the two kings met for the first time. Each brought his marshal, his court wizard and a single box. The Fulgar King's box held the helms of his knights. The Angtapa King's held the crowns of every lord he had lost.</p>
  <p>The old abbess who kept the chapel turned one of the helms over in her hands. Upside down, its visor became a crown. <i>"Your knights and your lords are the same men,"</i> she said, <i>"only turned a different way. A knight already stands on the lowest step of nobility. Let him climb by his deeds. Settle your war with them, and let the board bleed instead of the valley."</i></p>

  <h3><span class="orn">❦</span> III. The Name</h3>
  <p class="dc">Neither king would let the game carry only his enemy's tongue. So the abbess joined them: the western word for the art of generals, <i>strategy</i>, and the eastern sages' word for cleverness, <i>chatura</i>. The game became <b>Strahtura</b>, clever strategy in the language of both empires, just as Fulgar and Angtapa had each named themselves for the power of their wizards.</p>

  <h3><span class="orn">❦</span> IV. The Ladder of Prestige</h3>
  <p class="dc">The abbess taught that every soldier on the board may rise. A <b>knight</b> fights on foot. Two who ride together become <b>cavalry</b>, mounted knights. A knight who reaches the enemy's last line, or cavalry who fight their way onto enemy soil, earn a title and are <b>promoted</b> to <b>nobles</b>. Two nobles who join their houses rise to a <b>king</b>.</p>
  <p>A noble may also leave the court to study the arcane. His tower rises where he stood, and from it he steps out as a <b>wizard</b>. Two wizards together become an <b>archmage</b>, a wizard standing on his own tower. Yet a wizard never stops being a lord: he may always <b>restore</b> himself to his title at court.</p>

  <h3><span class="orn">❦</span> V. The Terms of the Kings' Accord</h3>
  <p class="dc">So the two kings wrote the Kings' Accord, and its law became the rules of Strahtura:</p>
  <ul>
  <li><b>Two commands each dawn.</b> No general of the Long War could ever do just one thing, so each turn grants two actions.</li>
  <li><b>The challenged chooses the relic; the challenger strikes first.</b> Angtapa had been challenged, so Black chooses an artifact first and White moves first.</li>
  <li><b>Titles are earned on enemy soil.</b> No empire may buy a lordship at home: cavalry may be promoted only in the enemy's half of the field.</li>
  <li><b>No empire may raise more than four lords by bargain.</b> Titles won by trade are limited; titles won by valor are not.</li>
  <li><b>The fallen may be recruited back,</b> one each dawn, each to a camp the enemy can see. The Accord forbade ambush by reinforcement.</li>
  <li><b>The towers belong to the wizards.</b> None may take them but an archmage. Through a tower a commander's troops may pass, a <b>tower shift</b>, and every passage pushes the tower back toward the one who used it.</li>
  <li><b>When an empire has but one lord left,</b> he must never be placed in harm's way, and if he cannot escape, the empire has lost.</li>
  </ul>

  <h3><span class="orn">❦</span> VI. The Relics</h3>
  <p class="dc">Each empire laid one relic on the table beside the board, a memory of the Long War: the hidden archers of the Weeping Ridge, the stone golem that broke the siege of Harrowgate, the royal decree of a king who once titled a stable boy, the war banner, the sellswords from across the sea, the berserker of the northern shore, the sapper's powder keg, the blink rune, the flanking flag and the shield wall. A relic could be used once, then sealed back in the treasure box, because no one should win a war twice by the same trick.</p>

  <h3><span class="orn">❦</span> VII. The Game That Ended the War</h3>
  <p class="dc">The kings played for seven nights. The chronicles disagree on who won. The Fulgar chroniclers say their king's last knight crossed the board and was crowned on the final night. The Angtapa chroniclers say their king stalemated him and called it victory. Both agree on what came after: the losing empire opened its granaries to the winner's hungry, and the winner opened its roads to the loser's trade. Neither army marched again.</p>
  <p>Ever since, when Fulgar and Angtapa cannot agree, they do not raise spears. They set out the helms, turn two of them into crowns, and play Strahtura.</p>
  <p class="rbs" style="margin-top:14px">— from the Chronicle of the Ruined Chapel</p></div>`;
}

/* ===================== HEADER BUTTONS ===================== */
$('cAuto').checked=autoEnd;
$('cAuto').onchange=e=>{autoEnd=e.target.checked;try{localStorage.setItem('pc_autoEnd',autoEnd?'1':'0');}catch(err){}render();};
$('bPause').onclick=()=>{paused=!paused;botToken++;render();};
$('bStep').onclick=()=>{if(!paused||!botTurn())return;const level=S.mode.ai[S.turn];if(S.actionsLeft<=0&&!S.berserk){doEndTurn();return;}const a=botChoose(S,level);if(!a){if(S.berserk){const st=LEG.find(x=>x.k==='bstop');if(st){doAction(st);return;}}doEndTurn();return;}doAction(a);};
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=now-lastTick;lastTick=now;
  if(!S.clock||S.phase!=='play'||S.winner||paused)return;
  S.clock[S.turn]-=dt;
  if(S.clock[S.turn]<=0){S.clock[S.turn]=0;S.winner=opp(S.turn);S.result=`Time — ${NAME[S.turn]}'s clock ran out. ${NAME[opp(S.turn)]} wins.`;S.log.push(`★ ${S.result}`);botToken++;render();return;}
  updClocks();
},250);
$('bUndo').onclick=()=>{if(!H.length)return;botToken++;const ck=S.clock,wn=S.winner&&S.result.startsWith('Time');S=JSON.parse(H.pop());while(H.length&&isAI(S.turn)&&!(S.mode.ai.w&&S.mode.ai.b)&&S.phase==='play')S=JSON.parse(H.pop());if(ck&&!wn)S.clock=ck;ui={kinds:null,path:[],sel:null};render();};
$('bForfeit').onclick=()=>{
  if(S.phase!=='play'||S.winner)return;
  if(!confirmForfeit){confirmForfeit=true;$('bForfeit').textContent='Click again to forfeit';setTimeout(()=>{confirmForfeit=false;const b=$('bForfeit');if(b)b.textContent='Forfeit';},2500);return;}
  confirmForfeit=false;$('bForfeit').textContent='Forfeit';
  const loser=S.turn,winner=opp(loser);
  H.push(JSON.stringify(S));botToken++;
  S.winner=winner;S.result=`Forfeit — ${NAME[loser]} resigns. ${NAME[winner]} wins.`;S.log.push(`★ ${S.result}`);
  ui={kinds:null,path:[],sel:null};playFx('win');render();
};
$('bStyle').onclick=()=>{modalView='style';render();};
$('bMusic').onclick=()=>{prefs.music=prefs.music===false?true:false;savePrefs();syncMusic(true);markMusic();};
$('bNew').onclick=()=>{if(!confirmNew){confirmNew=true;$('bNew').textContent='Click again to confirm';setTimeout(()=>{confirmNew=false;$('bNew').textContent='New game';},2500);return;}confirmNew=false;$('bNew').textContent='New game';botToken++;paused=false;prefs.track='pursuit';musicPreview=false;savePrefs();S=newState();H=[];ui={kinds:null,path:[],sel:null};modalView=null;render();};
window.addEventListener('resize',()=>{if(document.body.classList.contains('sheet'))fitSheet();});
window.PC={get S(){return S},set S(v){S=v},botChoose,evalS,botPickArt,newState,gen,legalActions,apply,startTurn,endTurn,inDanger,checkApplies,render};
render();
</script>
